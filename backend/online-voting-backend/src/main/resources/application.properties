spring.application.name=online-voting-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/online_voting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:voting_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Voting@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${APP_JWT_SECRET:MsOdcijxRlZcsG0L4/WgxEIWUj4W/CRVQ3eiy7ElIm4=}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.reset-token-expiry-minutes=30

logging.level.root=INFO
logging.level.com.votingsystem=DEBUG

app.admin.name=System Admin
app.admin.email=admin@securevote.com
app.admin.password=Admin@12345